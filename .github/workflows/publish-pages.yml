name: Publish Mindrivo level content

on:
  push:
    branches: [main, publish-100k-library]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Publish one validated content snapshot at a time; never cancel an active deployment.
  group: mindrivo-level-content-publish
  cancel-in-progress: false
  queue: max

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: echo "Starting static library publication"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate indexed 100,000-level library
        run: node scripts/generate-level-library.cjs static-levels-generated
      - name: Validate every generated level and index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'static-levels-generated';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.maxLevel !== 100000 || manifest.indexChunkSize !== 100 || manifest.levelIndexTemplate !== 'indexes/{chunk}.json') throw new Error('Unexpected generated manifest');
          const seen = new Set();
          const seenPrompts = new Map();
          for (let chunk = 0; chunk < 1000; chunk++) {
            const name = String(chunk).padStart(3, '0');
            const index = JSON.parse(fs.readFileSync(path.join(root, 'indexes', name + '.json'), 'utf8'));
            if (!Array.isArray(index.levels)) throw new Error('Invalid index ' + name);
            for (const entry of index.levels) {
              const id = Number(entry.id);
              if (!Number.isInteger(id) || id < 11 || id > 100000 || seen.has(id)) throw new Error('Invalid/duplicate indexed ID ' + entry.id);
              if (entry.url !== 'levels/' + id + '.json') throw new Error('Unexpected content URL for ' + id);
              const level = JSON.parse(fs.readFileSync(path.join(root, entry.url), 'utf8'));
              if (Number(level.id) !== id) throw new Error('ID mismatch for ' + id);
              if (!Array.isArray(level.options) || level.options.length < 2 || new Set(level.options.map(String)).size !== level.options.length) throw new Error('Invalid options for ' + id);
              if (level.options.filter(x => String(x) === String(level.answer)).length !== 1) throw new Error('Answer must occur exactly once for ' + id);
              if (!Array.isArray(level.hint) || !level.hint.length || level.hint.some(x => typeof x !== 'string' || !x.trim())) throw new Error('Invalid hints for ' + id);
              if (typeof level.prompt !== 'string' || !level.prompt.trim() || typeof level.explanation !== 'string' || !level.explanation.trim()) throw new Error('Missing prompt/explanation for ' + id);
              const normalizedPrompt = level.prompt.trim().replace(/\\s+/g, ' ').toLowerCase();
              if (seenPrompts.has(normalizedPrompt)) throw new Error('Duplicate prompt for levels ' + seenPrompts.get(normalizedPrompt) + ' and ' + id);
              seenPrompts.set(normalizedPrompt, id);
              seen.add(id);
            }
          }
          if (seen.size !== 99990) throw new Error('Expected 99,990 remote levels; found ' + seen.size);
          for (let id = 11; id <= 100000; id++) if (!seen.has(id)) throw new Error('Missing level ' + id);
          console.log('Validated all ' + seen.size + ' remote levels, unique prompts, and 1,000 indexes.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-levels-generated
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
